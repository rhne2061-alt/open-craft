<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Orbit Field</title><style>*{box-sizing:border-box}body{margin:0;font-family:Helvetica,"PingFang SC",sans-serif}a{color:inherit}a:focus-visible,summary:focus-visible{outline:3px solid #318a4b;outline-offset:5px}body{background:#18262e;color:#f6f8ef;min-height:480px;display:grid;place-items:center;overflow-x:hidden}.scene{width:min(640px,100%);height:460px;position:relative;display:grid;place-items:center;overflow:hidden}.orbit{position:absolute;width:72%;height:30%;border:1px solid #7e9b81;border-radius:50%;transform:rotate(var(--r))}.sun{width:85px;height:85px;border-radius:50%;background:#ceff76;box-shadow:0 0 75px #b5ea6140}.label{position:absolute;top:30px;left:30px;font:11px monospace;letter-spacing:3px}h1{position:absolute;bottom:15px;left:30px;font:clamp(32px,7vw,55px) Georgia,serif;font-weight:normal}small{position:absolute;bottom:32px;right:30px;font:10px monospace}@media(max-width:400px){small{display:none}}</style></head><body><main class="scene"><span class="label">ORBIT FIELD / 001</span><div aria-hidden="true" class="orbit" style="--r:0deg"></div><div aria-hidden="true" class="orbit" style="--r:45deg"></div><div aria-hidden="true" class="orbit" style="--r:90deg"></div><div aria-hidden="true" class="orbit" style="--r:135deg"></div><div class="sun" aria-hidden="true"></div><h1>Ideas have gravity.</h1><small>PURE CSS · ZERO DEPENDENCIES</small></main></body></html>
